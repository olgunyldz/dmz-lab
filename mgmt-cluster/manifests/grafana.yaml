# Grafana (mgmt cluster, ns observability). Veri kaynakları: Prometheus (metrikler) ve Jaeger (izler).
# Veri kaynakları ve dashboard provizyonla yüklenir; admin parolası secret'tan gelir (scripts/install-grafana: repoda yok).
# Depolama: emptyDir (lab; dashboard ConfigMap'ten yeniden yüklenir). Prod: kalıcı volume, SSO/OIDC ile giriş.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.observability.svc.cluster.local:9090
        isDefault: true
      - name: Jaeger
        uid: jaeger
        type: jaeger
        access: proxy
        url: http://jaeger.observability.svc.cluster.local:16686
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: observability
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: lab
        folder: DMZ Lab
        type: file
        disableDeletion: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
