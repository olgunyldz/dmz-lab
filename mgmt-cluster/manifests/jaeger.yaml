# Dağıtık izleme toplayıcısı (lab): Jaeger all-in-one, OTLP/HTTP alımı ve UI.
#   - OTLP alımı (4318) NodePort 30318: DMZ/iç servisler mgmt node IP'si üzerinden gönderir (172.18.0.12:30318)
#   - UI (16686) NodePort 30686 ve console port-forward ile
# Depolama: bellek (lab). Prod: kalıcı depolama (ör. Tempo/Elasticsearch), örnekleme ve erişim denetimi.
# Görüntü: jaegertracing/all-in-one:1.62.0 (kind'a `docker save --platform linux/amd64` + `kind load image-archive` ile yüklenir).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: { app: jaeger }
  template:
    metadata:
      labels: { app: jaeger }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          imagePullPolicy: IfNotPresent
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - name: ui
              containerPort: 16686
            - name: otlp-http
              containerPort: 4318
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observability
spec:
  selector: { app: jaeger }
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-otlp-nodeport
  namespace: observability
spec:
  type: NodePort
  selector: { app: jaeger }
  ports:
    - name: otlp-http
      port: 4318
      targetPort: 4318
      nodePort: 30318
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-ui-nodeport
  namespace: observability
spec:
  type: NodePort
  selector: { app: jaeger }
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
      nodePort: 30686
---
# OTLP/gRPC (4317): Envoy (kgateway) span'leri bu porta gönderir (ListenerPolicy tracing)
apiVersion: v1
kind: Service
metadata:
  name: jaeger-otlp-grpc-nodeport
  namespace: observability
spec:
  type: NodePort
  selector: { app: jaeger }
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      nodePort: 30317
