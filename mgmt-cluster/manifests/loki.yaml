# Loki (mgmt cluster, ns observability): loglar. Tek binary, dosya sistemi depolama.
# Depolama: 10Gi PVC (kind varsayılan storage class). Log gönderimi: Alloy (alloy.yaml); NodePort 30100 diğer cluster'lar için.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: observability
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    analytics:
      reporting_enabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: observability
spec:
  replicas: 1
  strategy:
    type: Recreate        # RWO PVC: eski pod kapanmadan yenisi volume'u alamaz
  selector:
    matchLabels: {app: loki}
  template:
    metadata:
      labels: {app: loki}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: loki
          image: grafana/loki:3.5.7
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports:
            - {name: http, containerPort: 3100}
            - {name: grpc, containerPort: 9095}
          readinessProbe:
            httpGet: {path: /ready, port: 3100}
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /loki}
      volumes:
        - name: config
          configMap: {name: loki-config}
        - name: data
          persistentVolumeClaim: {claimName: loki-data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: observability
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: observability
spec:
  selector: {app: loki}
  ports:
    - {name: http, port: 3100, targetPort: 3100}
    - {name: grpc, port: 9095, targetPort: 9095}
---
apiVersion: v1
kind: Service
metadata:
  name: loki-nodeport
  namespace: observability
spec:
  type: NodePort
  selector: {app: loki}
  ports:
    - {name: http, port: 3100, targetPort: 3100, nodePort: 30100}
