apiVersion: v1
kind: Namespace
metadata:
  name: gw-web
  labels:
    channel: web
---
apiVersion: v1
kind: Namespace
metadata:
  name: gw-mobile
  labels:
    channel: mobile
---
apiVersion: v1
kind: Namespace
metadata:
  name: gw-partner
  labels:
    channel: partner

# ============================================================================
# WEB
# ============================================================================
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-web
  namespace: gw-web
spec:
  gatewayClassName: kgateway
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gw-web-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: gw-web
spec:
  parentRefs:
    - name: gw-web
  rules:
    # İç BFF'e (mTLS, BackendTLSPolicy) yönlendirme: /bff/* (design 5.1)
    - matches:
        - path:
            type: PathPrefix
            value: /bff/
      backendRefs:
        - name: internal-gw
          port: 443

# ============================================================================
# MOBILE
# ============================================================================
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-mobile
  namespace: gw-mobile
spec:
  gatewayClassName: kgateway
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gw-mobile-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mobile
  namespace: gw-mobile
spec:
  parentRefs:
    - name: gw-mobile
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /bff/
      backendRefs:
        - name: internal-gw
          port: 443

# ============================================================================
# PARTNER: istemci sertifikası (mTLS) gateway'de doğrulanır
# ============================================================================
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-partner
  namespace: gw-partner
spec:
  gatewayClassName: kgateway
  tls:
    frontend:
      default:
        validation:
          caCertificateRefs:
            - group: ""
              kind: ConfigMap
              name: partner-ca
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gw-partner-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: partner
  namespace: gw-partner
spec:
  parentRefs:
    - name: gw-partner
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /partner/
      backendRefs:
        - name: internal-gw
          port: 443

# ============================================================================
# STUB BACKEND'LER (geçici): her kanal için nginx, kanal adını ve pod adını döner
# ============================================================================
---
