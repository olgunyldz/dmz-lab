# Seal Mobile (VENDOR MOCK) — DMZ cluster, ns seal-mobile. SDK'nın konuştuğu, internete açık kısım.
# TLS PASSTHROUGH: HAProxy (SNI seal.lab.local) -> gw-seal (TLS açmaz) -> seal-mobile pod (cihaz mTLS burada).
# Cihaz sertifikası device CA'sına karşı pod'da doğrulanır (CERT_REQUIRED). ext-authz bu yolda yok (L7 görünürlük yok).
# İç çağrılar: internal-gw Service -> gw-internal NodePort 30444 (DMZ istemci sertifikasıyla mTLS).
apiVersion: v1
kind: Namespace
metadata:
  name: seal-mobile
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seal-mobile
  namespace: seal-mobile
spec:
  replicas: 1
  selector:
    matchLabels: {app: seal-mobile}
  template:
    metadata:
      labels: {app: seal-mobile}
    spec:
      containers:
        - name: seal-mobile
          image: dmz-lab/seal-mobile:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            # İzleme: span'ler mgmt cluster'daki OTLP girişine gider (NodePort 30318)
            - name: SERVICE_NAME
              value: seal-mobile
            - name: OTLP_ENDPOINT
              value: http://__MGMT_NODE_IP__:30318
            - name: SM_PORT
              value: "8443"
            - name: SM_TLS_CERT
              value: /tls/server.crt
            - name: SM_TLS_KEY
              value: /tls/server.key
            - name: SM_DEVICE_CA
              value: /certs/device-ca.crt
            - name: SM_CA
              value: /certs/internal-ca.crt
            - name: SM_CLIENT_CERT
              value: /client/client.crt
            - name: SM_CLIENT_KEY
              value: /client/client.key
            - name: SM_INTERNAL
              value: internal-gw.seal-mobile.svc:443
            # IdP token doğrulaması (JWKS, introspection) gw-internal üzerinden (IdP'ye doğrudan bağlantı yok)
            - name: SM_ISSUER
              value: https://id.bank.lab.local/realms/bank
            - name: SM_AUDIENCE
              value: channel-mobile
            - name: SM_CHANNEL
              value: mobile
            - name: SM_MOBILE_SECRET
              valueFrom:
                secretKeyRef: {name: sm-keys, key: SEAL_MOBILE_SECRET}
            - name: SM_PM_KEY
              valueFrom:
                secretKeyRef: {name: sm-keys, key: SEAL_PM_KEY}
            - name: SM_MOCK_KEY
              valueFrom:
                secretKeyRef: {name: sm-keys, key: SEAL_MOCK_KEY}
          ports:
            - containerPort: 8443
          readinessProbe:
            tcpSocket: {port: 8443}
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: device-ca
              mountPath: /certs/device-ca.crt
              subPath: device-ca.crt
              readOnly: true
            - name: internal-ca
              mountPath: /certs/internal-ca.crt
              subPath: internal-ca.crt
              readOnly: true
            - name: client
              mountPath: /client
              readOnly: true
            - name: tracing
              mountPath: /app/tracing.py
              subPath: tracing.py
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: tls
          secret:
            secretName: sm-tls
        - name: device-ca
          secret:
            secretName: sm-device-ca
        - name: internal-ca
          secret:
            secretName: sm-internal-ca
        - name: client
          secret:
            secretName: sm-dmz-client
        - name: tracing
          configMap:
            name: seal-mobile-code
---
apiVersion: v1
kind: Service
metadata:
  name: seal-mobile
  namespace: seal-mobile
spec:
  selector: {app: seal-mobile}
  ports:
    - name: https
      port: 8443
      targetPort: 8443
---
# Pod -> iç gateway: gw-internal NodePort (30444) için ClusterIP + Endpoints (lab sapması; prod: iç ağ yönlendirmesi)
apiVersion: v1
kind: Service
metadata:
  name: internal-gw
  namespace: seal-mobile
spec:
  ports:
    - name: https
      port: 443
      targetPort: 30444
---
apiVersion: v1
kind: Endpoints
metadata:
  name: internal-gw
  namespace: seal-mobile
subsets:
  - addresses:
      - ip: __INTERNAL_NODE_IP__
    ports:
      - name: https
        port: 30444
---
# Cihaz yüzü: passthrough gateway (TLS sonlandırmaz). Dinleyici 443, TLSRoute SNI seal.lab.local -> seal-mobile:8443.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-seal
  namespace: seal-mobile
spec:
  gatewayClassName: kgateway
  listeners:
    - name: seal-pt
      port: 443
      protocol: TLS
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: seal
  namespace: seal-mobile
spec:
  parentRefs:
    - name: gw-seal
      sectionName: seal-pt
  hostnames:
    - seal.lab.local
  rules:
    - backendRefs:
        - name: seal-mobile
          port: 8443
---
# HAProxy (edge) bağlantısı için DMZ NodePort (F1 izin listesinde; dmz-cluster/scripts/host-firewall.sh)
apiVersion: v1
kind: Service
metadata:
  name: gw-seal-nodeport
  namespace: seal-mobile
spec:
  type: NodePort
  selector:
    gateway.networking.k8s.io/gateway-name: gw-seal
  ports:
    - name: tls
      port: 443
      targetPort: 443
      nodePort: 30456
