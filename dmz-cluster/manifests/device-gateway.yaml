# Cihaz güven (device trust) yolu, DMZ tarafı: TLS PASSTHROUGH (mTLS cihaz sertifikası device-trust'ta doğrulanır).
# Akış: HAProxy (SNI device.lab.local, L4) -> gw-device NodePort 30452 -> TLSRoute -> internal-gw-device
#       -> iç gateway passthrough (NodePort 30453) -> identity device-trust (NodePort 30445).
# Bu gateway TLS'i sonlandırmaz; istemci sertifikasını da görmez/doğrulamaz (bilerek).
apiVersion: v1
kind: Namespace
metadata:
  name: gw-device
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-device
  namespace: gw-device
spec:
  gatewayClassName: kgateway
  listeners:
    - name: device-pt
      port: 443
      protocol: TLS
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: device
  namespace: gw-device
spec:
  parentRefs:
    - name: gw-device
      sectionName: device-pt
  hostnames:
    - device.lab.local
  rules:
    - backendRefs:
        - name: internal-gw-device
          port: 443
---
# İç gateway'in passthrough NodePort'una Endpoints (iç düğüm IP'si; lab sapması, prod: iç ağ yönlendirmesi)
apiVersion: v1
kind: Service
metadata:
  name: internal-gw-device
  namespace: gw-device
spec:
  ports:
    - name: tls
      port: 443
      targetPort: 30453
---
apiVersion: v1
kind: Endpoints
metadata:
  name: internal-gw-device
  namespace: gw-device
subsets:
  - addresses:
      - ip: __INTERNAL_NODE_IP__
    ports:
      - name: tls
        port: 30453
---
# HAProxy'nin (edge) bağlandığı DMZ NodePort (F1 izin listesinde; bkz. dmz-cluster/scripts/host-firewall.sh)
apiVersion: v1
kind: Service
metadata:
  name: gw-device-nodeport
  namespace: gw-device
spec:
  type: NodePort
  selector:
    gateway.networking.k8s.io/gateway-name: gw-device
  ports:
    - name: tls
      port: 443
      targetPort: 443
      nodePort: 30452
