# DMZ cluster (lab). Tasarım 4.2: DMZ gateway'leri bu cluster'da çalışır.
# Lab için 1 control-plane + 2 worker. Üretimde en az 3+3 (design.md, bölüm 11).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dmz
nodes:
  - role: control-plane
  - role: worker
    labels:
      pool: dmz
  - role: worker
    labels:
      pool: dmz
