# Seal Mobile (VENDOR MOCK) — codevo-dmz cluster, ns seal-mobile. SDK'nın konuştuğu, internete açık kısım.
# Cihaz mTLS seal-mobile pod'unda sonlanır (CERT_REQUIRED, device CA). Edge HAProxy (SNI seal.lab.local) -> NodePort 30456.
# İç çağrılar doğrudan (seçim 1): auth-server = bank-prod node IP:30543 (auth-server), PM = mgmt node IP:30455 (Password Manager).
apiVersion: v1
kind: Namespace
metadata:
  name: seal-mobile
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seal-mobile
  namespace: seal-mobile
spec:
  replicas: 1
  selector:
    matchLabels: {app: seal-mobile}
  template:
    metadata:
      labels: {app: seal-mobile}
    spec:
      containers:
        - name: seal-mobile
          image: dmz-lab/seal-mobile:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: OTLP_ENDPOINT, value: "__OTLP_URL__"}
            - {name: SM_PORT, value: "8443"}
            - {name: SM_TLS_CERT, value: /tls/server.crt}
            - {name: SM_TLS_KEY, value: /tls/server.key}
            - {name: SM_DEVICE_CA, value: /certs/device-ca.crt}
            - {name: SM_CA, value: /certs/internal-ca.crt}
            - {name: SM_CLIENT_CERT, value: /client/client.crt}
            - {name: SM_CLIENT_KEY, value: /client/client.key}
            - {name: SM_AUTH, value: "__AUTH_NODE_IP__:30543"}
            - {name: SM_AUTH_SNI, value: id.bank.lab.local}
            - {name: SM_PM, value: "__LEGACY_NODE_IP__:30890"}
            - {name: SM_PM_SNI, value: fortuna-mock.fortuna.svc}
            - {name: SM_ISSUER, value: "https://id.bank.lab.local/realms/bank"}
            - {name: SM_AUDIENCE, value: channel-mobile}
            - {name: SM_CHANNEL, value: mobile}
            - {name: SM_METRICS_PORT, value: "9100"}
            - {name: SERVICE_NAME, value: seal-mobile}
            - name: SM_MOBILE_SECRET
              valueFrom: {secretKeyRef: {name: sm-keys, key: SEAL_MOBILE_SECRET}}
            - name: SM_PM_KEY
              valueFrom: {secretKeyRef: {name: sm-keys, key: SEAL_PM_KEY}}
            - name: SM_MOCK_KEY
              valueFrom: {secretKeyRef: {name: sm-keys, key: SEAL_MOCK_KEY}}
          ports:
            - containerPort: 8443
            - containerPort: 9100
          readinessProbe:
            tcpSocket: {port: 8443}
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: device-ca, mountPath: /certs/device-ca.crt, subPath: device-ca.crt, readOnly: true}
            - {name: internal-ca, mountPath: /certs/internal-ca.crt, subPath: internal-ca.crt, readOnly: true}
            - {name: client, mountPath: /client, readOnly: true}
            - {name: tracing, mountPath: /app/tracing.py, subPath: tracing.py, readOnly: true}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: tls
          secret: {secretName: sm-tls}
        - name: device-ca
          secret: {secretName: sm-device-ca}
        - name: internal-ca
          secret: {secretName: sm-internal-ca}
        - name: client
          secret: {secretName: sm-auth-client}
        - name: tracing
          configMap: {name: seal-mobile-code}
---
apiVersion: v1
kind: Service
metadata:
  name: seal-mobile
  namespace: seal-mobile
spec:
  type: ClusterIP
  selector: {app: seal-mobile}
  ports:
    - name: tls
      port: 8443
      targetPort: 8443
---
# Prometheus metrik kazıma (düz HTTP, mTLS ana portundan ayrı): NodePort 30457 -> 9100
apiVersion: v1
kind: Service
metadata:
  name: seal-mobile-metrics
  namespace: seal-mobile
spec:
  type: NodePort
  selector: {app: seal-mobile}
  ports:
    - {name: metrics, port: 9100, targetPort: 9100, nodePort: 30457}
