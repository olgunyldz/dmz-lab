# auth-server (bank-prod cluster, namespace: auth). Spring Authorization Server (services/auth-server kodu).
# Sırlar ve TLS materyali scripts/load-auth-server.sh tarafından üretilir (repoda sır yok):
#   secret auth-secrets : AUTH_DB_PASSWORD, ALICE_PASSWORD, WEB_APP_SECRET, BFF_SECRET, AUTH_TLS_*, AUTH_SIGNING_*, ...
#   secret auth-tls     : server.p12 (sunucu), trust.p12 (lab CA)
#   secret auth-signing : signing.p12 (token imzalama anahtarı)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-auth-data
  namespace: auth
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-auth
  namespace: auth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: postgres-auth}
  template:
    metadata:
      labels: {app: postgres-auth}
    spec:
      containers:
        - name: postgres
          image: postgres:16.15-alpine
          env:
            - {name: POSTGRES_DB, value: auth}
            - {name: POSTGRES_USER, value: auth}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: auth-secrets, key: AUTH_DB_PASSWORD}}
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-auth-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-auth
  namespace: auth
spec:
  selector: {app: postgres-auth}
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-server
  namespace: auth
spec:
  replicas: 1
  selector:
    matchLabels: {app: auth-server}
  template:
    metadata:
      labels: {app: auth-server}
    spec:
      # Seal Intranet adı (cross-cluster): codevo-dmz düğüm IP'sine eşleme (SNI/SAN ad ile eşleşir)
      hostAliases:
        - ip: "__CODEVO_NODE_IP__"
          hostnames: ["seal-intranet.lab.local"]
      containers:
        - name: auth-server
          image: dmz-lab/auth-server:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: AUTH_OTLP_ENDPOINT, value: "__OTLP_TRACES_URL__"}
            - {name: AUTH_ISSUER, value: https://id.bank.lab.local/realms/bank}
            - {name: AUTH_DB_URL, value: "jdbc:postgresql://postgres-auth.auth.svc:5432/auth"}
            - {name: AUTH_DB_USER, value: auth}
            - name: AUTH_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: auth-secrets, key: AUTH_DB_PASSWORD}}
            - {name: AUTH_INTERNAL_CALLERS, value: "gw-internal,seal-mobile"}
            - {name: AUTH_INTERNAL_USER_ADMINS, value: "janus-web,janus-mobile"}
            - {name: AUTH_SEAL_URL, value: "https://seal-intranet.lab.local:30456"}
            - name: AUTH_INTERNAL_API_KEY
              valueFrom: {secretKeyRef: {name: auth-secrets, key: AUTH_INTERNAL_API_KEY}}
            - {name: AUTH_SIGNING_KEYSTORE, value: /signing/signing.p12}
            - name: AUTH_SIGNING_KEYSTORE_PASSWORD
              valueFrom: {secretKeyRef: {name: auth-secrets, key: AUTH_SIGNING_KEYSTORE_PASSWORD}}
            - {name: AUTH_TLS_KEYSTORE, value: /tls/server.p12}
            - name: AUTH_TLS_KEYSTORE_PASSWORD
              valueFrom: {secretKeyRef: {name: auth-secrets, key: AUTH_TLS_KEYSTORE_PASSWORD}}
            - {name: AUTH_TLS_TRUSTSTORE, value: /tls/trust.p12}
            - name: AUTH_TLS_TRUSTSTORE_PASSWORD
              valueFrom: {secretKeyRef: {name: auth-secrets, key: AUTH_TLS_TRUSTSTORE_PASSWORD}}
            - name: ALICE_PASSWORD
              valueFrom: {secretKeyRef: {name: auth-secrets, key: ALICE_PASSWORD}}
            - name: WEB_APP_SECRET
              valueFrom: {secretKeyRef: {name: auth-secrets, key: WEB_APP_SECRET}}
            - name: BFF_SECRET
              valueFrom: {secretKeyRef: {name: auth-secrets, key: BFF_SECRET}}
            - name: TELLER_PASSWORD
              valueFrom: {secretKeyRef: {name: auth-secrets, key: TELLER_PASSWORD}}
            - name: PARTNER_ACME_SECRET
              valueFrom: {secretKeyRef: {name: auth-secrets, key: PARTNER_ACME_SECRET}}
            - name: CORE_SVC_SECRET
              valueFrom: {secretKeyRef: {name: auth-secrets, key: CORE_SVC_SECRET}}
            - name: SEAL_B2B_SECRET
              valueFrom: {secretKeyRef: {name: auth-secrets, key: SEAL_B2B_SECRET}}
            - name: SEAL_MOBILE_SECRET
              valueFrom: {secretKeyRef: {name: auth-secrets, key: SEAL_MOBILE_SECRET}}
            - name: MOBILE_APP_SECRET
              valueFrom: {secretKeyRef: {name: auth-secrets, key: MOBILE_APP_SECRET}}
          ports:
            - containerPort: 8443
            - containerPort: 8080
            - containerPort: 9100
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /.well-known/openid-configuration
              port: 8443
            initialDelaySeconds: 20
            periodSeconds: 5
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: signing, mountPath: /signing, readOnly: true}
      volumes:
        - name: tls
          secret: {secretName: auth-tls}
        - name: signing
          secret: {secretName: auth-signing}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-server
  namespace: auth
spec:
  type: ClusterIP
  selector: {app: auth-server}
  ports:
    - name: https
      port: 8443
      targetPort: 8443
    - name: internal
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 9100
      targetPort: 9100
