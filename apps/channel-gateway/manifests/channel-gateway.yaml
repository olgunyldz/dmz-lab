# channel-gateway (bank-prod, ns channel): Janus server token'ını doğrular; BALANCE -> Fortuna monolith (legacy-demo).
# Kod ConfigMap'i channel-gateway-code, Janus anahtarları janus-verify secret'ı (scripts/load-channel-gateway.sh). Repoda sır yok.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: channel-gateway
  namespace: channel
spec:
  replicas: 1
  selector:
    matchLabels: {app: channel-gateway}
  template:
    metadata:
      labels: {app: channel-gateway}
    spec:
      automountServiceAccountToken: false
      hostAliases:
        - ip: "__LEGACY_NODE_IP__"
          hostnames: ["fortuna-mock.fortuna.svc"]
      containers:
        - name: app
          image: dmz-lab/channel-gateway:0.1.0
          env:
            - {name: OTLP_ENDPOINT, value: "__OTLP_URL__"}
            - {name: PORT, value: "8443"}
            - {name: TLS_CERT, value: /tls/server.crt}
            - {name: TLS_KEY, value: /tls/server.key}
            - {name: TLS_CA, value: /tls/ca.crt}
            - {name: FORTUNA_URL, value: "https://fortuna-mock.fortuna.svc:30890"}
            - {name: FORTUNA_TLS_CERT, value: /mtls-client/client.crt}
            - {name: FORTUNA_TLS_KEY, value: /mtls-client/client.key}
            - {name: FORTUNA_TLS_CA, value: /mtls-client/ca.crt}
            - name: JANUS_KEY_WEB
              valueFrom: {secretKeyRef: {name: janus-verify, key: JANUS_KEY_WEB}}
            - name: JANUS_KEY_MOBILE
              valueFrom: {secretKeyRef: {name: janus-verify, key: JANUS_KEY_MOBILE}}
          ports: [{containerPort: 8443}]
          readinessProbe: {httpGet: {path: /cg/health, port: 8443, scheme: HTTPS}, initialDelaySeconds: 3, periodSeconds: 5}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: mtls-client, mountPath: /mtls-client, readOnly: true}
      volumes:
        - name: tls
          secret: {secretName: channel-gateway-tls}
        - name: mtls-client
          secret: {secretName: channel-gateway-client}
---
apiVersion: v1
kind: Service
metadata: {name: channel-gateway, namespace: channel}
spec: {selector: {app: channel-gateway}, ports: [{name: https, port: 8443, targetPort: 8443}]}
---
# Janus (bank-dmz-prod) erişimi: NodePort 30990
apiVersion: v1
kind: Service
metadata: {name: channel-gateway-nodeport, namespace: channel}
spec:
  type: NodePort
  selector: {app: channel-gateway}
  ports: [{name: https, port: 8443, targetPort: 8443, nodePort: 30990}]
