# Janus (web ve mobile) — bank-dmz-prod cluster, ns janus. Kod ConfigMap'i janus-code (scripts/load-janus.sh).
# Anahtar: janus-keys secret'ı (JANUS_KEY_WEB, JANUS_KEY_MOBILE); loader üretir, repoda yok.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: janus-mobile
  namespace: janus
spec:
  replicas: 1
  selector:
    matchLabels: {app: janus-mobile}
  template:
    metadata:
      labels: {app: janus-mobile}
    spec:
      automountServiceAccountToken: false
      hostAliases:
        - ip: "__BANKPROD_NODE_IP__"
          hostnames: ["fortuna-users-cgw.channel.svc", "sms-otp-cgw.channel.svc", "channel-gateway.channel.svc", "id.bank.lab.local"]
        - ip: "__LEGACY_NODE_IP__"
          hostnames: ["fortuna-mock.fortuna.svc"]
      containers:
        - name: janus
          image: dmz-lab/janus:0.1.0
          env:
            - {name: OTLP_ENDPOINT, value: "__OTLP_URL__"}
            - {name: CHANNEL, value: mobile}
            - {name: PORT, value: "8080"}
            - {name: FORTUNA_CGW_URL, value: "https://fortuna-users-cgw.channel.svc:30880/cgw/verifyUserPin"}
            - {name: SMS_OTP_URL, value: "https://sms-otp-cgw.channel.svc:30881"}
            - {name: FORTUNA_URL, value: "https://fortuna-mock.fortuna.svc:30890"}
            - {name: CHANNEL_GATEWAY_URL, value: "https://channel-gateway.channel.svc:30990"}
            - {name: IDP_USERS_URL, value: "https://id.bank.lab.local:30543/internal/users"}
            - name: IDP_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: janus-idp, key: MOBILE_APP_SECRET}}
            - {name: JANUS_TLS_CERT, value: /mtls/client.crt}
            - {name: JANUS_TLS_KEY, value: /mtls/client.key}
            - {name: JANUS_TLS_CA, value: /mtls/ca.crt}
            - name: JANUS_KEY
              valueFrom: {secretKeyRef: {name: janus-keys, key: JANUS_KEY_MOBILE}}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /janus/health, port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: mtls, mountPath: /mtls, readOnly: true}
      volumes:
        - name: mtls
          secret: {secretName: janus-mtls-mobile}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: janus-web
  namespace: janus
spec:
  replicas: 1
  selector:
    matchLabels: {app: janus-web}
  template:
    metadata:
      labels: {app: janus-web}
    spec:
      automountServiceAccountToken: false
      hostAliases:
        - ip: "__BANKPROD_NODE_IP__"
          hostnames: ["fortuna-users-cgw.channel.svc", "sms-otp-cgw.channel.svc", "channel-gateway.channel.svc", "id.bank.lab.local"]
        - ip: "__LEGACY_NODE_IP__"
          hostnames: ["fortuna-mock.fortuna.svc"]
      containers:
        - name: janus
          image: dmz-lab/janus:0.1.0
          env:
            - {name: OTLP_ENDPOINT, value: "__OTLP_URL__"}
            - {name: CHANNEL, value: web}
            - {name: PORT, value: "8080"}
            - {name: FORTUNA_CGW_URL, value: "https://fortuna-users-cgw.channel.svc:30880/cgw/verifyUserPin"}
            - {name: SMS_OTP_URL, value: "https://sms-otp-cgw.channel.svc:30881"}
            - {name: FORTUNA_URL, value: "https://fortuna-mock.fortuna.svc:30890"}
            - {name: CHANNEL_GATEWAY_URL, value: "https://channel-gateway.channel.svc:30990"}
            - {name: IDP_USERS_URL, value: "https://id.bank.lab.local:30543/internal/users"}
            - name: IDP_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: janus-idp, key: WEB_APP_SECRET}}
            - {name: JANUS_TLS_CERT, value: /mtls/client.crt}
            - {name: JANUS_TLS_KEY, value: /mtls/client.key}
            - {name: JANUS_TLS_CA, value: /mtls/ca.crt}
            - name: JANUS_KEY
              valueFrom: {secretKeyRef: {name: janus-keys, key: JANUS_KEY_WEB}}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /janus/health, port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: mtls, mountPath: /mtls, readOnly: true}
      volumes:
        - name: mtls
          secret: {secretName: janus-mtls-web}
---
apiVersion: v1
kind: Service
metadata:
  name: janus-mobile
  namespace: janus
spec:
  type: ClusterIP
  selector: {app: janus-mobile}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: janus-web
  namespace: janus
spec:
  type: ClusterIP
  selector: {app: janus-web}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
