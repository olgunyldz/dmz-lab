# Tüm değerler ortam değişkenlerinden gelir (repo'da sır yok).
# Örnek: IDP_ISSUER=https://id.bank.lab.local/realms/bank
spring:
  application:
    name: spring-idp
  datasource:
    url: ${IDP_DB_URL:jdbc:postgresql://localhost:5432/idp}
    username: ${IDP_DB_USER:idp}
    password: ${IDP_DB_PASSWORD}
  flyway:
    enabled: true

# Dağıtık izleme: OTLP HTTP -> Tempo (mgmt NodePort 30318). Tüm istekler örneklenir (lab).
management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${IDP_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

server:
  port: 8443
  ssl:
    enabled: true
    key-store: ${IDP_TLS_KEYSTORE}
    key-store-password: ${IDP_TLS_KEYSTORE_PASSWORD}
    key-store-type: PKCS12
    # Exchange istemcileri (tls_client_auth) sertifika sunar; diğerleri sunmadan da bağlanabilir.
    client-auth: want
    # TLS 1.3'te isteğe bağlı istemci sertifikası (post-handshake auth) Tomcat'te desteklenmiyor;
    # bu yüzden yalnız TLS 1.2. Edge (HAProxy) zaten TLS 1.2+ kullanır.
    enabled-protocols: TLSv1.2
    trust-store: ${IDP_TLS_TRUSTSTORE}
    trust-store-password: ${IDP_TLS_TRUSTSTORE_PASSWORD}
    trust-store-type: PKCS12

idp:
  issuer: ${IDP_ISSUER:http://localhost:8443/realms/bank}
  # Token imzalama anahtarı: PKCS12 keystore (kalıcı; yeniden başlatmada aynı anahtar). Üretim: load-spring-idp.sh.
  signing:
    keystore: ${IDP_SIGNING_KEYSTORE}
    keystore-password: ${IDP_SIGNING_KEYSTORE_PASSWORD}
    alias: idp-sign
  # İç yol (düz HTTP, yalnız iç gateway/düğümler). XFCC ile istemci sertifikası bu porttan kabul edilir.
  internal-port: ${IDP_INTERNAL_PORT:8080}
  # mTLS güven deposu: Boot 4 server.ssl.trust-store'u Tomcat'e geçirmediği için IdpConfig doğrudan Tomcat'e yazar.
  tls:
    truststore: ${IDP_TLS_TRUSTSTORE}
    truststore-password: ${IDP_TLS_TRUSTSTORE_PASSWORD}
  users:
    alice:
      password: ${ALICE_PASSWORD}
    teller:
      password: ${TELLER_PASSWORD}
  clients:
    web-app:
      secret: ${WEB_APP_SECRET}
    partner-acme:
      secret: ${PARTNER_ACME_SECRET}
    bff:
      secret: ${BFF_SECRET}
    core-svc:
      secret: ${CORE_SVC_SECRET}
