# Password Manager (VENDOR MOCK) — identity cluster, ns seal-pm.
# Neden burada: PIN/parola hash'leri kimlik verisiyle aynı bölgede; yalnız iç gateway (gw-internal) erişir.
# Sırlar load-password-manager.sh ile üretilir (repoda sır yok). TLS: iç CA sertifikası.
apiVersion: v1
kind: Namespace
metadata:
  name: seal-pm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: password-manager
  namespace: seal-pm
spec:
  replicas: 1
  selector:
    matchLabels: {app: password-manager}
  template:
    metadata:
      labels: {app: password-manager}
    spec:
      containers:
        - name: password-manager
          image: dmz-lab/password-manager:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PM_PORT
              value: "8443"
            - name: PM_TLS_CERT
              value: /tls/server.crt
            - name: PM_TLS_KEY
              value: /tls/server.key
            - name: PM_KEY
              valueFrom:
                secretKeyRef: {name: pm-key, key: PM_KEY}
          ports:
            - containerPort: 8443
          readinessProbe:
            tcpSocket: {port: 8443}
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: tls
          secret:
            secretName: pm-tls
---
# Gateway'den (gw-internal) erişim için NodePort (identity node IP:30455; gw-internal Endpoints'i buraya bağlanır)
apiVersion: v1
kind: Service
metadata:
  name: password-manager
  namespace: seal-pm
spec:
  type: NodePort
  selector: {app: password-manager}
  ports:
    - name: https
      port: 8443
      targetPort: 8443
      nodePort: 30455
