# Identity cluster dışarı (iç kgateway'e) açılış: NodePort. Lab sapması; üretimde iç ağ yönlendirmesi.
apiVersion: v1
kind: Service
metadata:
  name: keycloak-nodeport
  namespace: auth
spec:
  type: NodePort
  selector: { app: keycloak }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
