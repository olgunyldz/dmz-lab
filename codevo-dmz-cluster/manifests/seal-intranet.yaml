# Seal Intranet (VENDOR MOCK) — codevo-dmz cluster, ns seal-intranet. Yalnızca auth-server (IdP) çağırır.
# Neden burada: IdP (kimlik ve orkestrasyon) ile aynı bölgede; zone istisnası gerekmez.
# TLS: iç CA (seal-intranet-tls). Dış ve internal gateway yolu yok: ClusterIP.
# Kimlik: IdP'nin seal-b2b istemcisinden aldığı token (aud=seal-intranet), JWKS IdP'den (küme içi HTTPS).
apiVersion: v1
kind: Namespace
metadata:
  name: seal-intranet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seal-intranet
  namespace: seal-intranet
spec:
  replicas: 1
  selector:
    matchLabels: {app: seal-intranet}
  template:
    metadata:
      labels: {app: seal-intranet}
    spec:
      containers:
        - name: seal-intranet
          image: dmz-lab/seal-intranet:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SI_PORT
              value: "8443"
            - name: SI_TLS_CERT
              value: /tls/server.crt
            - name: SI_TLS_KEY
              value: /tls/server.key
            # IdP JWKS: bank-prod node IP:30543 (auth-server), SNI id.bank.lab.local, iç CA
            - name: SI_IDP_URL
              value: __AUTH_NODE_IP__:30543
            - name: SI_IDP_HOST
              value: id.bank.lab.local
            - name: SI_CA
              value: /ca/ca.crt
            - name: SI_ISSUER
              value: https://id.bank.lab.local/realms/bank
            - name: SI_AUDIENCE
              value: seal-intranet
            - name: SI_ALLOWED_CLIENTS
              value: seal-b2b
            - name: SI_MOCK_KEY
              valueFrom:
                secretKeyRef: {name: si-mock, key: SEAL_MOCK_KEY}
            - {name: SI_METRICS_PORT, value: "9100"}
          ports:
            - containerPort: 8443
            - containerPort: 9100
          readinessProbe:
            tcpSocket: {port: 8443}
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: ca
              mountPath: /ca
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: tls
          secret:
            secretName: seal-intranet-tls
        - name: ca
          configMap:
            name: internal-ca-backend
---
apiVersion: v1
kind: Service
metadata:
  name: seal-intranet
  namespace: seal-intranet
spec:
  selector: {app: seal-intranet}
  ports:
    - name: https
      port: 8443
      targetPort: 8443
---
# Bank-prod auth-server'dan erişim (doğrudan NodePort): auth-server hostAliases ile bu düğüme eşler
apiVersion: v1
kind: Service
metadata:
  name: seal-intranet-nodeport
  namespace: seal-intranet
spec:
  type: NodePort
  selector: {app: seal-intranet}
  ports:
    - name: https
      port: 8443
      targetPort: 8443
      nodePort: 30643
---
# Prometheus metrik kazıma (düz HTTP): NodePort 30644 -> 9100
apiVersion: v1
kind: Service
metadata:
  name: seal-intranet-metrics
  namespace: seal-intranet
spec:
  type: NodePort
  selector: {app: seal-intranet}
  ports:
    - {name: metrics, port: 9100, targetPort: 9100, nodePort: 30644}
