# gw-internal -> IdP iç API (/internal/auth/*) — identity cluster, HTTPS NodePort 30443.
# Güven modeli (karar): IdP yalnız gw-internal kimliğini (CN=gw-internal) kabul eder. Çağıran (seal-mobile, DMZ)
# gw-internal frontend'inde DMZ istemci sertifikasıyla doğrulanır; gateway IdP'ye kendi sertifikasıyla bağlanır
# (Gateway spec.tls.backend.clientCertificateRef = gw-internal-tls; scripts/load-idp-internal.sh).
# Lab sapması: çağıran başına kimlik yok; prod'da SPIFFE/çağıran başına sertifika.
apiVersion: v1
kind: Service
metadata:
  name: identity-idp-https
  namespace: gw-internal
spec:
  ports:
    - name: https
      port: 443
      targetPort: 30443
---
apiVersion: v1
kind: Endpoints
metadata:
  name: identity-idp-https
  namespace: gw-internal
subsets:
  - addresses:
      - ip: __IDENTITY_NODE_IP__
    ports:
      - name: https
        port: 30443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: identity-idp-https
  namespace: gw-internal
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: identity-idp-https
  validation:
    hostname: id.bank.lab.local
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: internal-ca-backend
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: idp-internal-auth
  namespace: gw-internal
spec:
  parentRefs:
    - name: gw-internal
  rules:
    - matches:
        - path: {type: PathPrefix, value: /internal/auth/}
      backendRefs:
        - name: identity-idp-https
          port: 443
