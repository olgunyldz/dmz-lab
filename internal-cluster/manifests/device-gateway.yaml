# Cihaz güven yolu, iç taraf: TLS PASSTHROUGH (gw-internal'ın HTTPS/mTLS listener'ından AYRI bir gateway).
# DMZ'den gelen TLS (cihaz mTLS) olduğu gibi identity device-trust'a iletilir; sertifika burada doğrulanmaz.
# Akış: DMZ gw-device -> bu gateway NodePort 30453 -> TLSRoute -> identity-device-trust (Endpoints: identity NodePort 30445).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-device-int
  namespace: gw-internal
spec:
  gatewayClassName: kgateway
  listeners:
    - name: device-pt
      port: 443
      protocol: TLS
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: device-trust
  namespace: gw-internal
spec:
  parentRefs:
    - name: gw-device-int
      sectionName: device-pt
  hostnames:
    - device.lab.local
  rules:
    - backendRefs:
        - name: identity-device-trust
          port: 443
---
apiVersion: v1
kind: Service
metadata:
  name: identity-device-trust
  namespace: gw-internal
spec:
  ports:
    - name: tls
      port: 443
      targetPort: 30445
---
apiVersion: v1
kind: Endpoints
metadata:
  name: identity-device-trust
  namespace: gw-internal
subsets:
  - addresses:
      - ip: __IDENTITY_NODE_IP__
    ports:
      - name: tls
        port: 30445   # device-trust NodePort (identity cluster)
---
# DMZ gw-device'tan erişim için NodePort (lab; gw-internal-nodeport deseni)
apiVersion: v1
kind: Service
metadata:
  name: gw-device-int-nodeport
  namespace: gw-internal
spec:
  type: NodePort
  selector:
    gateway.networking.k8s.io/gateway-name: gw-device-int
  ports:
    - name: tls
      port: 443
      targetPort: 443
      nodePort: 30453
