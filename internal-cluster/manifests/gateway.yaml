# İç kgateway (north-south ingress). DMZ ext-authz buraya TLS ile bağlanır (F2).
# Identity cluster'daki IdP, selector'sız Service + Endpoints ile bağlanır (cluster dışı backend).
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-internal
  namespace: gw-internal
spec:
  gatewayClassName: kgateway
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gw-internal-tls
      allowedRoutes:
        namespaces:
          from: Same
  # DMZ kimliği (mTLS, F2): yalnızca iç CA'dan imzalı istemci sertifikası kabul edilir
  tls:
    frontend:
      default:
        validation:
          caCertificateRefs:
            - group: ""
              kind: ConfigMap
              name: dmz-client-ca
---
apiVersion: v1
kind: Service
metadata:
  name: identity-idp
  namespace: gw-internal
spec:
  ports:
    - name: http
      port: 80
      targetPort: 30081
---
apiVersion: v1
kind: Endpoints
metadata:
  name: identity-idp
  namespace: gw-internal
subsets:
  - addresses:
      - ip: __IDENTITY_NODE_IP__
    ports:
      - name: http
        port: 30081   # Spring IdP iç HTTP NodePort
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: identity-realms
  namespace: gw-internal
spec:
  parentRefs:
    - name: gw-internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /realms/
        - path:
            type: PathPrefix
            value: /.well-known/
        - path:
            type: Exact
            value: /login
      backendRefs:
        - name: identity-idp
          port: 80
