# İç cluster metrikleri (Prometheus, mgmt cluster'dan kazınır).
#   - bff / core: uygulama metrikleri. NodePort yalnızca METRİK portunu (9100) açar; API portu (8080) dışarıda değildir.
#   - kube-state-metrics: cluster durum metrikleri (pod, deployment, node...). Secret okumaz (RBAC ve --resources ile sınırlı).
# Lab kısayolu: NodePort'lar bir iç node IP'si üzerinden kazınır. Prod: her cluster'da kendi Prometheus'u + remote_write.
---
apiVersion: v1
kind: Service
metadata:
  name: bff-metrics
  namespace: app-bff
spec:
  type: NodePort
  selector: { app: bff }
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
      nodePort: 30901
---
apiVersion: v1
kind: Service
metadata:
  name: core-metrics
  namespace: app-core
spec:
  type: NodePort
  selector: { app: core }
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
      nodePort: 30902
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
  # Yalnız durum okunur; secret ve configmap ERİŞİMİ YOK
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces", "services", "endpoints", "persistentvolumeclaims"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: kube-state-metrics }
  template:
    metadata:
      labels: { app: kube-state-metrics }
    spec:
      serviceAccountName: kube-state-metrics
      automountServiceAccountToken: true
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
          imagePullPolicy: IfNotPresent
          args:
            - --resources=pods,nodes,namespaces,services,endpoints,persistentvolumeclaims,deployments,replicasets,statefulsets,daemonsets
          ports:
            - name: http-metrics
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics-nodeport
  namespace: kube-system
spec:
  type: NodePort
  selector: { app: kube-state-metrics }
  ports:
    - name: http-metrics
      port: 8080
      targetPort: 8080
      nodePort: 30904
