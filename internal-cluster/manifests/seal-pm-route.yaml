# gw-internal -> Password Manager (identity cluster, NodePort 30455). Yol: /seal-pm/ (yalnız iç gateway'den).
# Arka uç TLS: iç CA, SNI password-manager.seal-pm.svc. Endpoints iç ağ yönlendirmesi (lab sapması).
apiVersion: v1
kind: Service
metadata:
  name: identity-pm
  namespace: gw-internal
spec:
  ports:
    - name: https
      port: 443
      targetPort: 30455
---
apiVersion: v1
kind: Endpoints
metadata:
  name: identity-pm
  namespace: gw-internal
subsets:
  - addresses:
      - ip: __IDENTITY_NODE_IP__
    ports:
      - name: https
        port: 30455
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: identity-pm
  namespace: gw-internal
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: identity-pm
  validation:
    hostname: password-manager.seal-pm.svc
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: internal-ca-backend
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seal-pm
  namespace: gw-internal
spec:
  parentRefs:
    - name: gw-internal
  rules:
    - matches:
        - path: {type: PathPrefix, value: /seal-pm/}
      backendRefs:
        - name: identity-pm
          port: 443
