# İç servisler (BFF, core): iç JWT'yi kendileri doğrular. Kod: services/svc.py (ConfigMap svc-code).
# IdP JWKS: HTTPS, id.bank.lab.local -> identity node (hostAliases; iç CA). Düz HTTP yok.
# Kod ConfigMap'i scripts/load-services.sh ile yüklenir.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: app-bff
spec:
  replicas: 1
  selector:
    matchLabels: { app: bff }
  template:
    metadata:
      labels: { app: bff }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: bff
          image: python:3.12-alpine
          command: ["python", "/app/svc.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: SERVICE_NAME
              value: bff
            - name: OTLP_ENDPOINT
              value: http://__MGMT_NODE_IP__:30318
            - name: CORE_URL
              value: https://core.app-core.svc.cluster.local
            - name: CORE_CA
              value: /ca/ca.crt
            - name: ALLOWED_CHANNELS
              value: web,mobile,branch
            - name: EXPECTED_ISSUER
              value: https://id.bank.lab.local/realms/bank
            - name: AUDIENCE
              value: kgateway-internal
            - name: JWKS_URL
              value: https://id.bank.lab.local:30443/realms/bank/protocol/openid-connect/certs
            - name: JWKS_CA
              value: /ca/ca.crt
            - name: PUBLIC_PATHS
              value: "0"
            - name: PORT
              value: "8443"
            - name: TLS_CERT
              value: /tls/server.crt
            - name: TLS_KEY
              value: /tls/server.key
          ports:
            - containerPort: 8443
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: ca
              mountPath: /ca
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
      hostAliases:
        - ip: __IDENTITY_NODE_IP__
          hostnames: ["id.bank.lab.local"]
      volumes:
        - name: app
          configMap:
            name: svc-code
        - name: ca
          configMap:
            name: internal-ca-backend
        - name: tls
          secret:
            secretName: svc-bff-tls
---
apiVersion: v1
kind: Service
metadata:
  name: bff
  namespace: app-bff
spec:
  selector: { app: bff }
  ports:
    - name: https
      port: 443
      targetPort: 8443
---
# gw-internal -> BFF: arka uç TLS (iç CA)
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: bff
  namespace: app-bff
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: bff
  validation:
    hostname: bff.app-bff.svc.cluster.local
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: internal-ca-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
  namespace: app-core
spec:
  replicas: 1
  selector:
    matchLabels: { app: core }
  template:
    metadata:
      labels: { app: core }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: core
          image: python:3.12-alpine
          command: ["python", "/app/svc.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: SERVICE_NAME
              value: core
            - name: OTLP_ENDPOINT
              value: http://__MGMT_NODE_IP__:30318
            - name: ALLOWED_CHANNELS
              value: partner
            - name: EXPECTED_ISSUER
              value: https://id.bank.lab.local/realms/bank
            - name: AUDIENCE
              value: kgateway-internal
            - name: JWKS_URL
              value: https://id.bank.lab.local:30443/realms/bank/protocol/openid-connect/certs
            - name: JWKS_CA
              value: /ca/ca.crt
            - name: PUBLIC_PATHS
              value: "1"
            - name: PORT
              value: "8443"
            - name: TLS_CERT
              value: /tls/server.crt
            - name: TLS_KEY
              value: /tls/server.key
          ports:
            - containerPort: 8443
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: ca
              mountPath: /ca
              readOnly: true
      hostAliases:
        - ip: __IDENTITY_NODE_IP__
          hostnames: ["id.bank.lab.local"]
      volumes:
        - name: app
          configMap:
            name: svc-code
        - name: ca
          configMap:
            name: internal-ca-backend
        - name: tls
          secret:
            secretName: svc-core-tls
---
apiVersion: v1
kind: Service
metadata:
  name: core
  namespace: app-core
spec:
  selector: { app: core }
  ports:
    - name: https
      port: 443
      targetPort: 8443
---
# gw-internal -> core (partner, public yolları) ve BFF -> core: arka uç TLS (iç CA)
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: core
  namespace: app-core
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: core
  validation:
    hostname: core.app-core.svc.cluster.local
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: internal-ca-backend
