# bank-dmz-prod (kind): Janus mobil (30801) ve Janus web (30802).
# Edge (HAProxy) yalnızca 127.0.0.1 üzerinden erişir; kind ağına bağlı değildir.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: bank-dmz-prod
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30801   # Janus mobil
        hostPort: 30801
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30802   # Janus web
        hostPort: 30802
        listenAddress: "127.0.0.1"
        protocol: TCP
