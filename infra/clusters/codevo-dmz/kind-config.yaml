# codevo-dmz (kind): girişler nginx ingress NodePort 30456 (Seal Mobile ve Seal Intranet, SNI ile ayrılır).
# Edge (HAProxy) yalnızca 127.0.0.1 üzerinden erişir; kind ağına bağlı değildir.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: codevo-dmz
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30456   # Seal Mobile (seal.lab.local passthrough)
        hostPort: 30456
        listenAddress: "127.0.0.1"
        protocol: TCP
